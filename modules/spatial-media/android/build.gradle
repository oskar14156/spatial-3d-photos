apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.spatialmedia'
version = '1.0.0'

android {
  namespace 'expo.modules.spatialmedia'
  compileSdk safeExtGet('compileSdkVersion', 35)

  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 24)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '2.0.21')}"
  // BitmapFactory ignores EXIF orientation, so portrait shots would export
  // sideways without reading it ourselves.
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
