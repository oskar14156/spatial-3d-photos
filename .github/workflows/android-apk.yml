name: Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Embed JS bundle in debug variant
        working-directory: android
        run: |
          python3 -c "from pathlib import Path; p=Path('app/build.gradle'); s=p.read_text(); needle='    // debuggableVariants = [\"liteDebug\", \"prodDebug\"]'; replacement=needle+'\\n    debuggableVariants = []'; p.write_text(s.replace(needle, replacement, 1))"

      - name: Build standalone debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PbundleDebugJs=true -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Upload standalone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial3d-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: spatial3d-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
